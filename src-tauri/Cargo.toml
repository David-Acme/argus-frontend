[package]
name = "argus-desktop"
version = "1.0.0"
description = "Argus desktop client — native networking host (Tauri 2)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mdns-sd = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json"] }
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = "0.3"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
url = "2"
http = "1"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
